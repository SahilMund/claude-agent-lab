embeddings:
 provider: huggingface        # anthropic has no embeddings API — huggingface runs locally, no API key needed
 model: sentence-transformers/all-MiniLM-L6-v2
 dims: 384

semantic_cache:
 enabled: true
 redis_url: redis://localhost:6379
 threshold: 0.85
 ttl: 86400

tasks:
 db_path: .agent_lab/tasks.db

llm:
 # provider: anthropic | openai | gemini | groq | ollama
 # Switching providers is a config-only change — llm/factory.py picks the
 # matching LangChain integration and API key env var automatically
 # (ANTHROPIC_API_KEY / OPENAI_API_KEY / GOOGLE_API_KEY / GROQ_API_KEY;
 # ollama needs no key, just a local server — see .env.example).
 provider: openai
 model: gpt-4o-mini
 judge_model: gpt-4o-mini   # cheaper model used only for LLM-as-judge

skills:
 skills_dir: .agent_lab/skills

memory:
 db_path: .agent_lab/memory/memory.db
 summarize_at_tokens: 4000
 keep_last_messages: 20

# Cross-session facts/preferences, separate from the memory.* block above
# (which is per-session history keyed by thread_id). No source equivalent —
# see memory/long_term.py's module docstring.
long_term_memory:
 collection_name: claude_agent_lab_memory

chromadb:
 persist_dir: .agent_lab/chromadb/
 collection_name: codebase

rag:
 mode: hybrid              # semantic | hybrid

vector_store:
 provider: qdrant
 retrieval_mode: hybrid    # dense | sparse | hybrid

qdrant:
 collection_name: claude_agent_lab
