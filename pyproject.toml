[project]
name = "claude-agent-lab"
version = "0.1.0"
description = "Incremental rebuild of a RAG-powered, agentic CLI code assistant — a system-design learning project, ported from a reference implementation and adapted phase by phase."
authors = [
    {name = "Sahil", email = "msahilranjan@gmail.com"}
]
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "openai (>=2.43.0,<3.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain (>=1.3.11,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-openai (>=1.3.3,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-anthropic (>=1.4.7,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-google-genai (>=4.0.0,<5.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-groq (>=1.1.0,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-ollama (>=1.1.0,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-huggingface (>=1.2.2,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "sentence-transformers (>=6.0.0,<7.0.0)",
    "langchain-qdrant (>=1.1.0,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "fastembed (>=0.8.0,<0.9.0)",
    "langgraph-checkpoint-sqlite (>=3.1.0,<4.0.0)",
    "tree-sitter (>=0.25.0,<0.27.0)",
    "tree-sitter-language-pack (>=1.16.0,<2.0.0)",
    "langchain-mcp-adapters (>=0.3.0,<0.4.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "redis (>=7.4.1,<8.0.0)",
    "redisvl (>=0.23.0,<0.24.0) ; python_version >= \"3.12\" and python_version < \"3.15\""
]


[tool.poetry]
packages = [{include = "claude_agent_lab"}]


[tool.poetry.scripts]
claude_agent_lab = "claude_agent_lab.main:run"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
